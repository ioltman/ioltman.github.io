<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Counterfactual Ocean Tides &mdash; interactive notes</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="vendor/katex/dist/katex.min.css">
<script defer src="vendor/katex/dist/katex.min.js"></script>
<script defer src="vendor/katex/dist/contrib/auto-render.min.js"></script>
<script src="vendor/plotly/plotly.min.js"></script>
<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
</head>
<body>

<header>
  <h1>Counterfactual Ocean Tides</h1>
  <span class="sub">interactive companion to the working notes &mdash; gravity computed exactly, no equilibrium-tide approximation</span>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="app-views"></main>

<footer>
  Data precomputed by <code>solver.py</code> / <code>bodies.py</code> / <code>forcing.py</code> (see the full report). This page only renders it &mdash; no simulation runs in the browser.
</footer>

<template id="tpl-scenario">
  <section class="view">
    <div class="grid">
      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <h3 style="margin:0">Ocean surface height &mdash; click the map to pick a point</h3>
          <div class="dim-toggle">
            <button class="dim-btn dim-2d active" data-dim="2d">2D map</button>
            <button class="dim-btn dim-3d" data-dim="3d">3D globe</button>
          </div>
        </div>
        <div class="earth-stack">
          <div class="earth-mount earth-mount-2d"></div>
          <div class="earth-mount earth-mount-3d" style="display:none"></div>
        </div>
        <div class="legend-row">
          <span>low</span><span class="legend-bar"></span><span>high</span>
          <span style="margin-left:auto" class="pick-readout">no point picked &mdash; showing default</span>
        </div>
      </div>
      <div class="panel">
        <h3>What is being simulated</h3>
        <div class="orbit-mount orbit-container"></div>
        <div class="canvas-hint">Sun&ndash;Earth distance and Earth&ndash;Moon distance are NOT to the same scale (real ratio is ~389:1) &mdash; angular motion is exact, drawn from the same orbit integration used for the ocean forcing.</div>
        <div class="moon-legend" style="margin-top:0.4rem;"></div>
      </div>
      <div class="panel timeseries-panel">
        <h3>Sea surface height at the picked point &mdash; drag to zoom, click to scrub</h3>
        <div class="pick-info">Point: <b class="pick-label">6&deg;N, 180&deg;E (default)</b></div>
        <div class="ts-mount" id="ts-plot"></div>
        <div class="controls">
          <button class="play-btn">&#9654; Play</button>
          <input type="range" class="frame-slider" min="0" max="0" value="0" step="1" />
          <span class="day-readout">day 0.00</span>
          <label>speed
            <select class="speed-select">
              <option value="220" selected>0.5x</option>
              <option value="110">1x</option>
              <option value="55">2x</option>
              <option value="22">5x</option>
              <option value="11">10x</option>
            </select>
          </label>
        </div>
      </div>
    </div>
  </section>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
